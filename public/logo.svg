    <rect x="8" y="44" width="48" height="9" rx="4.5" fill="url(#sm-grad)" opacity="0.7"/>
    <rect x="8" y="59" width="40" height="9" rx="4.5" fill="url(#sm-grad)" opacity="0.55"/>
    <path d="M72 18 Q84 36 72 54" stroke="url(#sm-grad)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
