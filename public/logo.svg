<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" fill="none">
  <defs>
    <linearGradient id="cm-grad" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5B43C"/>
      <stop offset="100%" stop-color="#D4A531"/>
    </linearGradient>
  </defs>
  <!-- Icon: curtain + blind motif — elegant wave -->
  <g transform="translate(4,8)">
    <rect x="8" y="12" width="64" height="56" rx="4" fill="none" stroke="url(#cm-grad)" stroke-width="2"/>
    <!-- Curtain wave -->
    <path d="M8 20 Q25 10 40 20 Q55 30 72 20" stroke="url(#cm-grad)" stroke-width="2.5" fill="none"/>
    <path d="M8 30 Q25 22 40 30 Q55 38 72 30" stroke="url(#cm-grad)" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M8 40 Q25 34 40 40 Q55 46 72 40" stroke="url(#cm-grad)" stroke-width="1.5" fill="none" opacity="0.6"/>
    <!-- Bottom bar -->
    <rect x="8" y="64" width="64" height="4" rx="2" fill="url(#cm-grad)" opacity="0.5"/>
  </g>
  <!-- Wordmark -->
  <text x="92" y="42" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.3">
    <tspan fill="#1D2224">Curtain</tspan><tspan fill="url(#cm-grad)">Makers</tspan>
  </text>
  <text x="93" y="62" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="3.5" fill="#454B4D">ABU DHABI · DUBAI</text>
</svg>