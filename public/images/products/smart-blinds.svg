<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2137a3"/>
      <stop offset="100%" stop-color="#0f1b46"/>
    </linearGradient>
    <linearGradient id="slatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f09333"/>
      <stop offset="100%" stop-color="#E5B43C"/>
    </linearGradient>
    <linearGradient id="fabricGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a46c"/>
      <stop offset="50%" stop-color="#a08a5a"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="aluGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#b8b8b8"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
  </defs>
  <!-- Wall -->
  <rect width="800" height="600" fill="#1a1a1a"/>
  <!-- Window frame -->
  <rect x="100" y="60" width="600" height="440" rx="12" fill="url(#frameGrad)"/>
  <rect x="118" y="78" width="564" height="404" rx="8" fill="#121212"/>
  <!-- Floor hint -->
  <rect x="0" y="520" width="800" height="80" fill="#0d0d0d"/>
  <ellipse cx="400" cy="520" rx="320" ry="16" fill="#000000" opacity="0.4"/>

  <!-- Motor housing -->
  <rect x="140" y="70" width="80" height="34" rx="17" fill="url(#slatGrad)"/>
  <rect x="150" y="70" width="500" height="34" rx="17" fill="url(#aluGrad)"/>
  <!-- Fabric -->
  <rect x="160" y="104" width="480" height="330" fill="url(#fabricGrad)" opacity="0.92"/>
  <rect x="150" y="434" width="500" height="18" rx="6" fill="url(#aluGrad)"/>
  <!-- Signal waves -->
  <path d="M180 60 Q195 40 180 20" stroke="#E5B43C" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M200 65 Q225 35 200 5" stroke="#E5B43C" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M220 68 Q250 30 220 -5" stroke="#E5B43C" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Phone icon -->
  <g transform="translate(600,480)">
    <rect x="0" y="0" width="44" height="80" rx="8" fill="#2a2a2a" stroke="#E5B43C" stroke-width="2"/>
    <rect x="8" y="12" width="28" height="50" rx="3" fill="#1a1a1a"/>
    <circle cx="22" cy="70" r="4" fill="none" stroke="#E5B43C" stroke-width="1.5"/>
    <path d="M14 24 h16 M14 34 h16 M14 44 h10" stroke="#E5B43C" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="400" y="560" text-anchor="middle" fill="#b0b0b0" font-family="Inter,sans-serif" font-size="20" font-weight="600">Smart Motorized</text>
</svg>