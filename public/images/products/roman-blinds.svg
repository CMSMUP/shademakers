<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2137a3"/>
      <stop offset="100%" stop-color="#0f1b46"/>
    </linearGradient>
    <linearGradient id="slatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f09333"/>
      <stop offset="100%" stop-color="#E5B43C"/>
    </linearGradient>
    <linearGradient id="fabricGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a46c"/>
      <stop offset="50%" stop-color="#a08a5a"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="aluGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#b8b8b8"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
  </defs>
  <!-- Wall -->
  <rect width="800" height="600" fill="#1a1a1a"/>
  <!-- Window frame -->
  <rect x="100" y="60" width="600" height="440" rx="12" fill="url(#frameGrad)"/>
  <rect x="118" y="78" width="564" height="404" rx="8" fill="#121212"/>
  <!-- Floor hint -->
  <rect x="0" y="520" width="800" height="80" fill="#0d0d0d"/>
  <ellipse cx="400" cy="520" rx="320" ry="16" fill="#000000" opacity="0.4"/>

  <path d="M160 110 Q400 124 640 110 L640 148 Q400 162 160 148 Z" fill="url(#fabricGrad)" opacity="0.95" stroke="#aaa" stroke-width="1"/>

  <path d="M160 165 Q400 179 640 165 L640 203 Q400 217 160 203 Z" fill="url(#fabricGrad)" opacity="0.8899999999999999" stroke="#aaa" stroke-width="1"/>

  <path d="M160 220 Q400 234 640 220 L640 258 Q400 272 160 258 Z" fill="url(#fabricGrad)" opacity="0.83" stroke="#aaa" stroke-width="1"/>

  <path d="M160 275 Q400 289 640 275 L640 313 Q400 327 160 313 Z" fill="url(#fabricGrad)" opacity="0.77" stroke="#aaa" stroke-width="1"/>

  <path d="M160 330 Q400 344 640 330 L640 368 Q400 382 160 368 Z" fill="url(#fabricGrad)" opacity="0.71" stroke="#aaa" stroke-width="1"/>

  <path d="M160 385 Q400 399 640 385 L640 423 Q400 437 160 423 Z" fill="url(#fabricGrad)" opacity="0.6499999999999999" stroke="#aaa" stroke-width="1"/>

  <!-- Bottom hem -->
  <rect x="150" y="430" width="500" height="14" rx="4" fill="url(#aluGrad)"/>
  <!-- Cord -->
  <line x1="660" y1="70" x2="660" y2="320" stroke="#888" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="400" y="560" text-anchor="middle" fill="#b0b0b0" font-family="Inter,sans-serif" font-size="20" font-weight="600">Roman Blinds</text>
</svg>