<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2137a3"/>
      <stop offset="100%" stop-color="#0f1b46"/>
    </linearGradient>
    <linearGradient id="slatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f09333"/>
      <stop offset="100%" stop-color="#FDEB07"/>
    </linearGradient>
    <linearGradient id="fabricGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a46c"/>
      <stop offset="50%" stop-color="#a08a5a"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="aluGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#b8b8b8"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
  </defs>
  <!-- Wall -->
  <rect width="800" height="600" fill="#1a1a1a"/>
  <!-- Window frame -->
  <rect x="100" y="60" width="600" height="440" rx="12" fill="url(#frameGrad)"/>
  <rect x="118" y="78" width="564" height="404" rx="8" fill="#121212"/>
  <!-- Floor hint -->
  <rect x="0" y="520" width="800" height="80" fill="#0d0d0d"/>
  <ellipse cx="400" cy="520" rx="320" ry="16" fill="#000000" opacity="0.4"/>

  <rect x="140" y="100" width="520" height="22" rx="3" fill="url(#woodGrad)" stroke="#6b5320" stroke-width="1" transform="rotate(-4 400 111)"/>

  <rect x="140" y="148" width="520" height="22" rx="3" fill="url(#woodGrad)" stroke="#6b5320" stroke-width="1" transform="rotate(4 400 159)"/>

  <rect x="140" y="196" width="520" height="22" rx="3" fill="url(#woodGrad)" stroke="#6b5320" stroke-width="1" transform="rotate(-4 400 207)"/>

  <rect x="140" y="244" width="520" height="22" rx="3" fill="url(#woodGrad)" stroke="#6b5320" stroke-width="1" transform="rotate(4 400 255)"/>

  <rect x="140" y="292" width="520" height="22" rx="3" fill="url(#woodGrad)" stroke="#6b5320" stroke-width="1" transform="rotate(-4 400 303)"/>

  <rect x="140" y="340" width="520" height="22" rx="3" fill="url(#woodGrad)" stroke="#6b5320" stroke-width="1" transform="rotate(4 400 351)"/>

  <rect x="140" y="388" width="520" height="22" rx="3" fill="url(#woodGrad)" stroke="#6b5320" stroke-width="1" transform="rotate(-4 400 399)"/>

  <rect x="140" y="436" width="520" height="22" rx="3" fill="url(#woodGrad)" stroke="#6b5320" stroke-width="1" transform="rotate(4 400 447)"/>

  <!-- Ladder tapes -->
  <line x1="220" y1="90" x2="220" y2="490" stroke="#d4c5b9" stroke-width="3" opacity="0.7"/>
  <line x1="580" y1="90" x2="580" y2="490" stroke="#d4c5b9" stroke-width="3" opacity="0.7"/>
  <!-- Tilt wand -->
  <rect x="150" y="90" width="8" height="180" rx="4" fill="#888"/>
  <text x="400" y="560" text-anchor="middle" fill="#b0b0b0" font-family="Inter,sans-serif" font-size="20" font-weight="600">Wooden Venetian</text>
</svg>