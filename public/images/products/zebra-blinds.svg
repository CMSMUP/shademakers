<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2137a3"/>
      <stop offset="100%" stop-color="#0f1b46"/>
    </linearGradient>
    <linearGradient id="slatGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f09333"/>
      <stop offset="100%" stop-color="#E5B43C"/>
    </linearGradient>
    <linearGradient id="fabricGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4a46c"/>
      <stop offset="50%" stop-color="#a08a5a"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="aluGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="50%" stop-color="#b8b8b8"/>
      <stop offset="100%" stop-color="#909090"/>
    </linearGradient>
  </defs>
  <!-- Wall -->
  <rect width="800" height="600" fill="#1a1a1a"/>
  <!-- Window frame -->
  <rect x="100" y="60" width="600" height="440" rx="12" fill="url(#frameGrad)"/>
  <rect x="118" y="78" width="564" height="404" rx="8" fill="#121212"/>
  <!-- Floor hint -->
  <rect x="0" y="520" width="800" height="80" fill="#0d0d0d"/>
  <ellipse cx="400" cy="520" rx="320" ry="16" fill="#000000" opacity="0.4"/>

  <rect x="155" y="100" width="490" height="28" fill="url(#fabricGrad)" opacity="0.95"/>
  <rect x="155" y="128" width="490" height="28" fill="url(#fabricGrad)" opacity="0.35"/>

  <rect x="155" y="156" width="490" height="28" fill="url(#fabricGrad)" opacity="0.95"/>
  <rect x="155" y="184" width="490" height="28" fill="url(#fabricGrad)" opacity="0.35"/>

  <rect x="155" y="212" width="490" height="28" fill="url(#fabricGrad)" opacity="0.95"/>
  <rect x="155" y="240" width="490" height="28" fill="url(#fabricGrad)" opacity="0.35"/>

  <rect x="155" y="268" width="490" height="28" fill="url(#fabricGrad)" opacity="0.95"/>
  <rect x="155" y="296" width="490" height="28" fill="url(#fabricGrad)" opacity="0.35"/>

  <rect x="155" y="324" width="490" height="28" fill="url(#fabricGrad)" opacity="0.95"/>
  <rect x="155" y="352" width="490" height="28" fill="url(#fabricGrad)" opacity="0.35"/>

  <rect x="155" y="380" width="490" height="28" fill="url(#fabricGrad)" opacity="0.95"/>
  <rect x="155" y="408" width="490" height="28" fill="url(#fabricGrad)" opacity="0.35"/>

  <rect x="155" y="436" width="490" height="28" fill="url(#fabricGrad)" opacity="0.95"/>
  <rect x="155" y="464" width="490" height="28" fill="url(#fabricGrad)" opacity="0.35"/>

  <!-- Roller cassette -->
  <rect x="145" y="66" width="510" height="30" rx="15" fill="url(#aluGrad)"/>
  <text x="400" y="560" text-anchor="middle" fill="#b0b0b0" font-family="Inter,sans-serif" font-size="20" font-weight="600">Zebra (Day &amp; Night)</text>
</svg>